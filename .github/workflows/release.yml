name: Release

# 手动触发：构建 sdist/wheel 并发布到 PyPI（Trusted Publishing）。
# 首次使用前需在 PyPI 登记 Trusted Publisher：
#   pypi.org → 项目 pending publisher → owner=ningL32 repo=cli-gateway
#   workflow=release.yml environment=pypi
# 配置好后到 GitHub Actions 页面 Run workflow 即完成发布。

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build sdist and wheel
        run: |
          pip install build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # PyPI Trusted Publishing（OIDC）
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
