[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cli-gateway"
version = "0.1.0"
description = "统一 CLI 进程调用网关：全量日志落盘 + 回放 + 结构化返回"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
cli-gateway = "cli_gateway.__main__:main"

[tool.setuptools]
packages = ["cli_gateway"]
