[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cli-gateway"
description = "统一 CLI 进程调用网关：全量日志落盘 + 回放 + 结构化返回——AI 调 CLI 的可观测层"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ningL32" }]
keywords = ["subprocess", "cli", "gateway", "audit", "observability", "ai-agents"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: System :: Monitoring",
]
dynamic = ["version"]

[project.scripts]
cli-gateway = "cli_gateway.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/ningL32/cli-gateway"
Changelog = "https://github.com/ningL32/cli-gateway/blob/main/CHANGELOG.md"
Issues = "https://github.com/ningL32/cli-gateway/issues"

[tool.setuptools]
packages = ["cli_gateway"]

[tool.setuptools.dynamic]
version = { attr = "cli_gateway.__version__" }
